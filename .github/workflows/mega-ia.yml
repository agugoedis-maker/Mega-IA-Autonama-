
name: Mega-IA Autonoma

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  executar-mega-ia:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: principal

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar Mega-IA
        run: python mega_ia.py

      - name: Salvar historico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          git diff --cached --quiet || git commit -m "Atualiza historico da Mega-IA"
          git push origin HEAD:principal
